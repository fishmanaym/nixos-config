source=./binds.conf
source=./colors.conf

xkb_rules_layout=es

gappoh=5
gappov=5

animations=1

animation_type_open=zoom
animation_type_close=zoom

cursor_size=24
cursor_theme=Adwaita

# exec-once=waybar (launched via systemd)
exec-once=wlsunset -l 40.3 -L -3.8

exec-once=wbg $XDG_CONFIG_HOME/mango/wallpaper.jpg
