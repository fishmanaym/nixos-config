source=./binds.conf
source=./colors.conf

idle_inhibit_when_fullscreen	= 1

xkb_rules_layout=es

gap_outer_horizontal=5
gap_outer_vertical=5

animations=1

animation_type_open=zoom
animation_type_close=zoom

cursor_size=24
cursor_theme=Adwaita

device_rule=type:trackpad,disable_while_typing:1

no_border_when_single=1
smart_gaps=1

# exec-once=waybar (launched via systemd)
exec_once=wlsunset -l 40.3 -L -3.8

# swayidle configuration
# exec-once=swayidle -w timeout 300 'swaylock -f -c 000000' timeout 600 'mmsg dispatch sleep_monitor' resume 'mmsg dispatch wakeup_monitor' before-sleep 'swaylock -f -c 000000'

exec_once=wbg $XDG_CONFIG_HOME/mango/wallpaper.jpg
