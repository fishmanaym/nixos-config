circle_layout=tile,scroller,monocle,grid,deck,center_tile,vertical_tile,right_tile,vertical_scroller,vertical_grid,vertical_deck,dwindle,fair,vertical_fair
bind=SUPER,j,switch_layout

#### SCRATCHPAD ####
# Send current window to scratchpad
bind=SUPER,i,minimized

# Toggle (show/hide) the scratchpad
bind=ALT,z,toggle_scratchpad

# Retrieve window from scratchpad (restore)
bind=SUPER+SHIFT,i,restore_minimized

bind=SUPER,q,spawn,foot
bind=SUPER,c,killclient
bind=SUPER,m,quit
bind=SUPER,f,spawn,firefox
bind=SUPER,s,spawn,steam
bind=SUPER,v,toggleoverlay
bind=SUPER,tab,toggleoverview
bind=SUPER,R,spawn,fuzzel
bind = SUPER,p, toggleglobal
bind = SUPER+SHIFT,w,togglemaximizescreen
bind = SUPER+SHIFT+ALT,w,togglefullscreen
bind = SUPER+SHIFT+ALT+CTRL,w,togglefakefullscreen
# mousebind = NONE,btn_middle,spawn,wl-copy -pc # disable middle click copy paste

# Move focus with mainMod + arrow keys
bind = SUPER, left, exchange_client, left
bind = SUPER, right, exchange_client, right
bind = SUPER, up, exchange_client, up
bind = SUPER, down, exchange_client, down

bind = SUPER+ALT,left,focusdir,left
bind = SUPER+ALT,right,focusdir,right
bind = SUPER+ALT,up,focusdir,up
bind = SUPER+ALT,down,focusdir,down

# Switch workspaces with mainMod + [0-9]
bind = SUPER,1,view,1
bind = SUPER,2,view,2
bind = SUPER,3,view,3
bind = SUPER,4,view,4
bind = SUPER,5,view,5
bind = SUPER,6,view,6
bind = SUPER,7,view,7
bind = SUPER,8,view,8
bind = SUPER,9,view,9

# Move active window to a workspace with mainMod + SHIFT + [1-9]
bind = SUPER+SHIFT,1,tag,1
bind = SUPER+SHIFT,2,tag,2
bind = SUPER+SHIFT,3,tag,3
bind = SUPER+SHIFT,4,tag,4
bind = SUPER+SHIFT,5,tag,5
bind = SUPER+SHIFT,6,tag,6
bind = SUPER+SHIFT,7,tag,7
bind = SUPER+SHIFT,8,tag,8
bind = SUPER+SHIFT,9,tag,9

bind = SUPER+ALT+SHIFT,1,tagsilent,1
bind = SUPER+ALT+SHIFT,2,tagsilent,2
bind = SUPER+ALT+SHIFT,3,tagsilent,3
bind = SUPER+ALT+SHIFT,4,tagsilent,4
bind = SUPER+ALT+SHIFT,5,tagsilent,5
bind = SUPER+ALT+SHIFT,6,tagsilent,6
bind = SUPER+ALT+SHIFT,7,tagsilent,7
bind = SUPER+ALT+SHIFT,8,tagsilent,8
bind = SUPER+ALT+SHIFT,9,tagsilent,9

axisbind = SUPER,DOWN,tagtoleft
axisbind = SUPER,UP,tagtoright

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# tengo que modificarlo y tal para hacerlo mejor con satty o algo
bind = NONE, Print, spawn_shell, grim -g "$(slurp -d)" - | wl-copy
bind = CTRL, Print, spawn_shell, grim - | wl-copy
bind = SUPER, Print, spawn_shell, grim -g "$(hyprctl -j activewindow | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy

# Laptop multimedia keys for volume and LCD brightness
bindl = NONE,XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl = NONE,XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = NONE,XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = NONE,XF86AudioMicMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = NONE,XF86MonBrightnessUp, spawn_shell, brightnessctl set 5%+ && pkill -RTMIN+1 waybar
bindl = NONE,XF86MonBrightnessDown, spawn_shell, brightnessctl set 5%- && pkill -RTMIN+1 waybar

# Requires playerctl
bindl = NONE,XF86AudioNext,spawn,playerctl next
bindl = NONE,XF86AudioPause,spawn,playerctl play-pause
#bindl = NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl = NONE,XF86AudioPrev,spawn,playerctl previous
