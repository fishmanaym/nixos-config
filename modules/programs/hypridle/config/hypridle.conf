general {
    lock_cmd = swaylock -c 0d0d0d
    before_sleep_cmd = loginctl lock-session                        # lock before suspend.
    after_sleep_cmd = mmsg dispatch wakeup_monitor                  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                                   # 2.5min.
    on-timeout = brightnessctl -s set 10 && pkill -RTMIN+1 waybar   # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r  && pkill -RTMIN+1 waybar          # monitor backlight restore.
}

listener {
    timeout = 300                                                   # 5min
    on-timeout = loginctl lock-session                              # lock screen when timeout has passed
}

listener {
    timeout = 330                                                   # 5.5min
    on-timeout = mmsg dispatch sleep_monitor                        # screen off when timeout has passed
    on-resume = mmsg dispatch wakeup_monitor                        # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                                  # 30min
    on-timeout = systemctl suspend                                  # suspend pc
}
